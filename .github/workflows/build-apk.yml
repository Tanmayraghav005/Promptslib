name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies and build web assets
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version must be 17 or higher (detected: $JAVA_MAJOR)"
            exit 1
          fi

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ] && [ ! -f ./android/debug.keystore ] && [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            echo "Debug keystore created successfully."
          else
            echo "Debug keystore already exists."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build the debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        id: verify-apk
        run: |
          APK_PATH=""
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Searching in build outputs:"
            find . -name "*.apk"
            echo "Error: Expected debug APK not found."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty."
            exit 1
          fi

          echo "APK verified at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.verify-apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-release
        run: |
          TEMP_DIR=$(mktemp -d)
          cp "${{ steps.verify-apk.outputs.apk_path }}" "$TEMP_DIR/app-debug.apk"
          if [ ! -s "$TEMP_DIR/app-debug.apk" ]; then
            echo "Error: Release asset is missing or empty"
            exit 1
          fi
          echo "release_asset_path=$TEMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES="### Automatically generated Debug APK
          - **Built by:** GitHub Actions
          - **Run number:** #${{ github.run_number }}
          - **Run attempt:** ${{ github.run_attempt }}
          - **Source commit:** \`${{ github.sha }}\`
          - **Note:** This APK is intended for testing and debugging. Signed with a debug keystore."

          gh release create "$TAG_NAME" "${{ steps.prepare-release.outputs.release_asset_path }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create-release.outcome }}" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$TAG_NAME" || true
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            echo "==============================================="
            echo "DIRECT APK DOWNLOAD: $DOWNLOAD_URL"
            echo "==============================================="
            echo "## 📱 DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DOWNLOAD_URL]($DOWNLOAD_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "Normal Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped. However, the Actions artifact 'app-debug-apk' is uploaded."
            echo "Check Actions artifacts tab to download 'app-debug-apk'." >> "$GITHUB_STEP_SUMMARY"
          fi
